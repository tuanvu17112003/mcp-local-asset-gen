# CI for mcp-local-asset-gen: the suite is CPU-only (fake backend + canned
# fixtures), so every push/PR runs it on both OS families — the path jail has
# NTFS-specific branches that only Windows runners exercise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pip check
        run: pip check
      - name: Run tests
        run: python -m pytest tests/ -q
